name: Deploy frontend to Vercel

# Deploy the Vite frontend from main. A missing token must fail visibly rather
# than reporting a green run while skipping deployment.
#
# Required repository secret:
#   VERCEL_TOKEN - a Vercel personal access token with access to this project.
#
# The non-secret org/project identifiers are pinned here to the existing
# BluePace Vercel project so the workflow does not silently use another scope.
#
# IMPORTANT: Run Vercel CLI commands from the repository root. The existing
# Vercel project uses frontend-vite as its root directory. Running the CLI
# inside frontend-vite as well can apply rootDirectory twice and fail during
# the local Vercel build (for example, "Error: [ENOENT] spawn sh ENOENT").

on:
  push:
    branches: [main]
    paths:
      - "frontend-vite/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Rjt1DblVvXgrkIwTZ9t91a9L
      VERCEL_PROJECT_ID: prj_DpQbpA1dF1LtdcPyxBMAHEiZU1fy
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error title=Vercel deployment is not configured::Add the VERCEL_TOKEN repository secret in Settings > Secrets and variables > Actions. The workflow will not report a successful deployment until credentials are present."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull into repository-root .vercel so the project rootDirectory is
      # resolved relative to the checkout root instead of being appended to
      # frontend-vite a second time.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
