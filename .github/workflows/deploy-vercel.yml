name: Deploy frontend to Vercel

# Manual production deployment only.
# Vercel's Git integration already deploys pushes to main. Running this CLI
# deployment on every push creates a duplicate deployment and can exhaust the
# Hobby plan's 100-deployments-per-24-hours limit. Use workflow_dispatch only
# when a deliberate redeploy is needed and the Vercel quota is available.
# A missing token must fail visibly rather than silently skipping deployment.
#
# Required repository secret:
#   VERCEL_TOKEN - a Vercel personal access token with access to this project.
#
# The non-secret org/project identifiers are pinned here to the existing
# BluePace Vercel project so the workflow does not silently use another scope.
#
# IMPORTANT: Run Vercel CLI commands from the repository root. The existing
# Vercel project uses frontend-vite as its root directory. Running the CLI
# inside frontend-vite as well can apply rootDirectory twice and fail during
# the local Vercel build (for example, "Error: [ENOENT] spawn sh ENOENT").

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Rjt1DblVvXgrkIwTZ9t91a9L
      VERCEL_PROJECT_ID: prj_DpQbpA1dF1LtdcPyxBMAHEiZU1fy
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error title=Vercel deployment is not configured::Add the VERCEL_TOKEN repository secret in Settings > Secrets and variables > Actions. The workflow will not report a successful deployment until credentials are present."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull into repository-root .vercel so the project rootDirectory is
      # resolved relative to the checkout root instead of being appended to
      # frontend-vite a second time.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        shell: bash
        run: |
          set -o pipefail
          deploy_output="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1)" || {
            if grep -Eq 'Resource is limited|api-deployments-free-per-day' <<<"$deploy_output"; then
              echo "$deploy_output"
              echo "::warning title=Vercel deployment quota exceeded::The Vercel Hobby plan has hit its 100 deployments / 24h limit. The workflow will skip the redeploy instead of failing the job. Wait 24 hours or upgrade the Vercel plan to continue deploying."
              exit 0
            fi
            echo "$deploy_output"
            echo "::error title=Vercel deployment failed::Deployment failed. Check the output above for details."
            exit 1
          }
          echo "$deploy_output"

      - name: Smoke-test production alias and security headers
        shell: bash
        run: |
          production_url="https://bluepace-ats-frontend.vercel.app/"
          for attempt in $(seq 1 12); do
            response_file="$(mktemp)"
            header_file="$(mktemp)"
            status_code="$(curl --silent --show-error --location --max-time 15 --dump-header "$header_file" --output "$response_file" --write-out '%{http_code}' "$production_url" || true)"
            if [[ "$status_code" == "200" ]] \
              && grep -qi '<title>BluePace ATS' "$response_file" \
              && grep -qi 'id="root"' "$response_file" \
              && grep -Eiq '^strict-transport-security:[[:space:]]*max-age=31536000' "$header_file" \
              && grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$header_file" \
              && grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$header_file" \
              && grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "$header_file" \
              && grep -Eiq '^permissions-policy:.*camera=\(\).*microphone=\(\).*geolocation=\(\)' "$header_file"; then
              rm -f "$response_file" "$header_file"
              echo "Production smoke test passed: HTTP 200, expected BluePace ATS HTML, and required security headers found."
              exit 0
            fi
            rm -f "$response_file" "$header_file"
            echo "Production alias not ready or security headers missing (attempt $attempt/12, HTTP ${status_code:-unknown})."
            sleep 5
          done
          echo "::error title=Production security smoke test failed::Vercel did not serve expected BluePace ATS HTML and all required security headers."
          exit 1

      - name: Smoke-test JD and Applicant Match model API
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://bluepace-ats-frontend.vercel.app/v1/models"
          response="$(curl --silent --show-error --location --max-time 20 --fail "$api_url")"
          node -e '
            const fs = require("node:fs");
            const rows = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!Array.isArray(rows)) throw new Error("GET /v1/models did not return a JSON array.");
            const ids = new Set(rows.map((row) => row.id));
            for (const id of ["openrouter", "gemini", "deepseek", "grok", "openai", "github-models"]) {
              if (!ids.has(id)) throw new Error("Model profile missing from live endpoint: " + id);
            }
            const retired = rows.find((row) => row.id === "github-models");
            if (retired.enabled !== false || !/retired/i.test(retired.disabled_reason || "")) {
              throw new Error("GitHub Models must be reported as retired instead of falsely enabled.");
            }
            console.log("JD & Applicant Match API passed: live model list is served from Vercel with current hosted model profiles.");
          ' <<< "$response"
