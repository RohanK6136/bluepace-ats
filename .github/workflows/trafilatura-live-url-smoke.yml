name: Live Trafilatura URL smoke check

on:
  push:
    branches:
      - smoke/trafilatura-live-url-import

permissions:
  contents: read

jobs:
  live-job-url-import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import public JPMorgan job URL through production ATS
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 --retry 1 --retry-delay 2 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --form-string 'job_url=https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/job/210794452' \
            'https://bluepace-ats-production.up.railway.app/resume-processing/job-description')"

          echo "HTTP status: $http_status"
          export SMOKE_HTTP_STATUS="$http_status"
          export SMOKE_RESPONSE_FILE="$response_file"
          python - <<'PY'
          import json
          import os
          import sys

          with open(os.environ["SMOKE_RESPONSE_FILE"], encoding="utf-8") as handle:
              payload = json.load(handle)

          status = os.environ["SMOKE_HTTP_STATUS"]
          if status != "200":
              detail = payload.get("detail", payload)
              print(f"Live job URL import failed: {str(detail)[:1000]}")
              sys.exit(1)

          description = str(payload.get("description") or "").strip()
          if len(description) < 40:
              print(f"Live job URL import returned too little text: {len(description)} characters")
              sys.exit(1)

          print(f"Source: {payload.get('source')}")
          print(f"Title: {payload.get('title') or '(title not detected)'}")
          print(f"Description characters: {len(description)}")
          print(f"Description preview: {description[:220]}")
          print("LIVE URL IMPORT PASSED")
          PY
