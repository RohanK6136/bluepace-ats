name: Build Vercel Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json
      - name: Install
        working-directory: frontend-vite
        run: npm ci
      - name: Build
        working-directory: frontend-vite
        env:
          VITE_API_URL: https://bluepace-ats-production.up.railway.app
          GITHUB_PAGES: "false"
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: bluepace-ats-frontend-dist
          path: frontend-vite/dist
          retention-days: 1
