name: Deploy backend to Google Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy FastAPI to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: bluepace-ats-api
          source: ./backend
          region: ${{ vars.CLOUD_RUN_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          flags: "--allow-unauthenticated"
          env_vars: |
            APP_ENV=production
            CORS_ORIGINS=${{ vars.FRONTEND_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}
            B2_REGION=${{ secrets.B2_REGION }}
            B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}
            B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}
            B2_BUCKET=${{ secrets.B2_BUCKET }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          env_vars_update_strategy: merge

      - name: Show service URL
        run: echo "${{ steps.deploy.outputs.url }}"
