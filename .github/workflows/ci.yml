name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - "streamlit_app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - "streamlit_app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: APP_ENV=test python -m pytest backend
      - name: Check Streamlit companion syntax
        run: python -m py_compile streamlit_app/app.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json
      - working-directory: frontend-vite
        run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend-vite
        shell: bash
        run: |
          audit_status=0
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit-report.json" || audit_status=$?
          node - "$RUNNER_TEMP/npm-audit-report.json" <<'NODE'
          const fs = require("node:fs");
          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const totals = report.metadata?.vulnerabilities || {};
          console.log("npm audit totals:", JSON.stringify(totals));
          for (const [name, vuln] of Object.entries(report.vulnerabilities || {}).sort((a, b) => a[0].localeCompare(b[0]))) {
            const advisories = (vuln.via || [])
              .filter((item) => item && typeof item === "object")
              .map((item) => item.title + (item.url ? " (" + item.url + ")" : ""));
            console.log(JSON.stringify({
              package: name,
              severity: vuln.severity,
              direct: vuln.isDirect,
              range: vuln.range,
              fixAvailable: vuln.fixAvailable,
              via: advisories,
              effects: vuln.effects,
            }));
          }
          NODE
          exit "$audit_status"
      - working-directory: frontend-vite
        run: npm run build
      - working-directory: frontend-vite
        run: npm run test:server
