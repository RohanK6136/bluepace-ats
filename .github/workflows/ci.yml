name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - "streamlit_app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - "streamlit_app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: APP_ENV=test python -m pytest backend
      - name: Check Streamlit companion syntax
        run: python -m py_compile streamlit_app/app.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json
      - working-directory: frontend-vite
        run: npm ci --no-audit --no-fund
      - working-directory: frontend-vite
        run: npm run build
      - working-directory: frontend-vite
        run: npm run test:server
