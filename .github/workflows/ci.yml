name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/production-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend-vite/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production smoke script syntax
        run: python -m py_compile .github/scripts/production_smoke.py
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: APP_ENV=test python -m pytest backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend-vite
        run: npm install --no-audit --no-fund
      - working-directory: frontend-vite
        run: npm run build