name: Production availability check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-availability.yml"
  pull_request:
    paths:
      - ".github/workflows/production-availability.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-availability-check
  cancel-in-progress: true

jobs:
  backend:
    name: Verify Render ATS API and database readiness
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check active Render API liveness and database readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://bluepace-ats-11.onrender.com"
          for endpoint in healthz readyz; do
            body="$(mktemp)"
            trap 'rm -f "$body"' EXIT
            if ! status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 75 \
              --retry 2 --retry-delay 5 --retry-connrefused \
              --output "$body" --write-out '%{http_code}' \
              "$base_url/$endpoint")"; then
              echo "::error title=Render ATS API unavailable::$endpoint request failed."
              exit 1
            fi
            if [[ "$status" != "200" ]]; then
              cat "$body"
              echo "::error title=Render ATS API unhealthy::$endpoint returned HTTP $status."
              exit 1
            fi
            python3 -c '
          import json, sys
          endpoint, filename = sys.argv[1:]
          with open(filename, encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = "ready" if endpoint == "readyz" else "ok"
          if payload.get("status") != expected:
              raise SystemExit(f"{endpoint} returned an unexpected status payload")
          if endpoint == "healthz" and payload.get("service") != "bluepace-ats":
              raise SystemExit("healthz returned an unexpected service identity")
          print(f"Render {endpoint} check passed")
          ' "$endpoint" "$body"
            rm -f "$body"
            trap - EXIT
          done

          # A healthy API is not enough: browser requests originate from Vercel.
          # Validate the preflight response for the canonical production frontend.
          for origin in "https://bluepace-ats-frontend.vercel.app"; do
            headers="$(mktemp)"
            trap 'rm -f "$headers"' EXIT
            status="$(curl --silent --show-error --request OPTIONS \
              --connect-timeout 10 --max-time 20 \
              --header "Origin: $origin" \
              --header "Access-Control-Request-Method: POST" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' "$base_url/auth/token")"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Render CORS preflight failed::$origin received HTTP $status."
              exit 1
            fi
            python3 - "$headers" "$origin" <<'PY'
          import sys
          from pathlib import Path
          header_path, expected_origin = sys.argv[1:]
          header_path = Path(header_path)
          values = {}
          for line in header_path.read_text(encoding="iso-8859-1").splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  values[name.strip().lower()] = value.strip()
          if values.get("access-control-allow-origin") != expected_origin:
              raise SystemExit(f"CORS allow-origin mismatch for {expected_origin}")
          methods = values.get("access-control-allow-methods", "").upper()
          headers = values.get("access-control-allow-headers", "").lower()
          if "POST" not in methods:
              raise SystemExit("CORS preflight does not allow POST")
          if "authorization" not in headers or "content-type" not in headers:
              raise SystemExit("CORS preflight does not allow Authorization and Content-Type")
          print(f"Render CORS preflight passed for {expected_origin}")
          PY
            rm -f "$headers"
            trap - EXIT
          done

          # Recruiter-only data must not be returned without an access token.
          auth_status="$(curl --silent --show-error --request GET \
            --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' "$base_url/jobs")"
          if [[ "$auth_status" != "401" && "$auth_status" != "403" ]]; then
            echo "::error title=ATS authentication guard failed::Unauthenticated GET /jobs returned HTTP $auth_status instead of 401/403."
            exit 1
          fi
          echo "ATS authentication guard passed: unauthenticated GET /jobs is rejected."

          # Public vacancy data must be reachable at runtime. An empty array is
          # valid (no current openings); 4xx/5xx or malformed JSON is not.
          public_body="$(mktemp)"
          trap 'rm -f "$public_body"' EXIT
          if ! public_status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 35 \
            --output "$public_body" --write-out '%{http_code}' \
            "$base_url/public/jobs?limit=1&offset=0")"; then
            echo "::error title=Public vacancies endpoint unavailable::Could not reach GET /public/jobs."
            exit 1
          fi
          if [[ "$public_status" != "200" ]]; then
            cat "$public_body"
            echo "::error title=Public vacancies endpoint failed::GET /public/jobs returned HTTP $public_status."
            exit 1
          fi
          python3 - "$public_body" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, list):
              raise SystemExit("GET /public/jobs did not return a JSON array")
          print(f"Public vacancies endpoint passed; first page returned {len(payload)} real records (zero is valid).")
          PY
          rm -f "$public_body"
          trap - EXIT

  frontend:
    name: Verify Vercel production frontend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production HTML and final-response security headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://bluepace-ats-frontend.vercel.app/"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          if ! status="$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")"; then
            echo "::error title=Frontend request failed::Could not retrieve the Vercel production alias."
            exit 1
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error title=Frontend unavailable::Expected HTTP 200, received $status"
            exit 1
          fi

          python3 - "$headers" "$body" <<'PY'
          import re
          import sys
          from pathlib import Path

          header_path, body_path = map(Path, sys.argv[1:])
          raw_headers = header_path.read_bytes().decode("iso-8859-1")
          blocks = [
              block for block in re.split(r"\r?\n\r?\n", raw_headers)
              if re.search(r"^HTTP/\S+\s+\d{3}", block, re.IGNORECASE | re.MULTILINE)
          ]
          if not blocks:
              raise SystemExit("::error title=Invalid HTTP response::No HTTP response headers were captured.")

          # curl writes one header block per redirect. Validate only the final
          # response so a redirect cannot mask missing headers on the page.
          final_headers = {}
          for line in blocks[-1].splitlines()[1:]:
              if ":" not in line:
                  continue
              name, value = line.split(":", 1)
              final_headers[name.strip().lower()] = value.strip()

          html = body_path.read_text(encoding="utf-8", errors="replace")
          if not re.search(r"<title>\s*BluePace ATS", html, re.IGNORECASE):
              raise SystemExit("::error title=Unexpected frontend content::Expected BluePace ATS page title was not found.")
          if not re.search(r'id=["\']root["\']', html, re.IGNORECASE):
              raise SystemExit("::error title=Unexpected frontend content::React root element was not found.")

          required = {
              "strict-transport-security": r"(?:^|;\s*)max-age=31536000(?:;|$)",
              "x-content-type-options": r"^nosniff$",
              "x-frame-options": r"^DENY$",
              "referrer-policy": r"^strict-origin-when-cross-origin$",
          }
          for name, pattern in required.items():
              value = final_headers.get(name, "")
              if not re.search(pattern, value, re.IGNORECASE):
                  raise SystemExit(f"::error title=Missing security header::{name} missing or invalid on final response.")

          policy = final_headers.get("permissions-policy", "")
          for feature in ("camera", "microphone", "geolocation"):
              if not re.search(rf"(?:^|,)\s*{feature}=\(\)", policy, re.IGNORECASE):
                  raise SystemExit(f"::error title=Invalid permissions policy::{feature} must be disabled.")

          print("Production check passed: HTTP 200, expected page title and React root, and all required security headers on the final response.")
          PY

      - name: Verify live frontend commit matches main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url="https://bluepace-ats-frontend.vercel.app/"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          if ! status="$(curl --silent --show-error --location --max-time 25 \
            --header 'Cache-Control: no-cache' \
            --output "$body" --write-out '%{http_code}' \
            "${url}?build-check=${GITHUB_SHA}")"; then
            echo "::error title=Production build identity unavailable::Could not fetch the cache-bypassed production HTML."
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error title=Production build identity failed::Production HTML returned HTTP $status."
            exit 1
          fi
          actual="$(python3 - "$body" <<'PY'
          import re
          import sys
          from pathlib import Path
          html = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          match = re.search(
              r'<meta\\s+name=["\\']bluepace-build-commit["\\']\\s+content=["\\']([a-f0-9]{40}|unknown)["\\']',
              html,
              re.IGNORECASE,
          )
          print(match.group(1).lower() if match else "missing")
          PY
          )"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "::error title=Production commit mismatch::main is $GITHUB_SHA but the live site reports $actual. The new release is not live."
            exit 1
          fi
          echo "Production commit matches main: $actual"

      - name: Check JD & Applicant Match model registry
        shell: bash
        run: |
          set -euo pipefail
          url="https://bluepace-ats-frontend.vercel.app/v1/models"
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --location --max-time 15 "$url" || true)"
            if node -e '
              const fs = require("node:fs");
              let rows;
              try { rows = JSON.parse(fs.readFileSync(0, "utf8")); } catch { process.exit(1); }
              if (!Array.isArray(rows)) process.exit(1);
              const ids = new Set(rows.map((row) => row.id));
              for (const id of ["openrouter", "gemini", "deepseek", "grok", "openai", "github-models"]) {
                if (!ids.has(id)) process.exit(1);
              }
              const retired = rows.find((row) => row.id === "github-models");
              if (retired.enabled !== false || !/retired/i.test(retired.disabled_reason || "")) process.exit(1);
            ' <<< "$response"; then
              echo "JD & Applicant Match model registry is live; provider profiles are being served by Vercel."
              exit 0
            fi
            echo "Model API not ready or returned unexpected output (attempt $attempt/12)."
            sleep 5
          done
          echo "::error title=JD & Applicant Match API missing::The live /v1/models endpoint did not return the expected model registry."
          exit 1


  notify:
    name: Notify on production health failure
    if: always() && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or resolve the single production health alert
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Production Alert] BluePace public careers and ATS health"
          issues_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100"
          issues="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$issues_url")"
          issue_number="$(node -e '
            const rows = JSON.parse(process.argv[1]);
            const title = process.argv[2];
            const issue = rows.find((row) => !row.pull_request && row.title === title);
            process.stdout.write(issue ? String(issue.number) : "");
          ' "$issues" "$title")"
          body="Backend availability: $BACKEND_RESULT
          Frontend availability: $FRONTEND_RESULT
          Commit: $GITHUB_SHA
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          This issue is maintained by the scheduled production health check. It is automatically closed after a successful recovery check."
          payload="$(node -e '
            process.stdout.write(JSON.stringify({
              title: process.argv[1],
              body: process.argv[2],
              state: process.argv[3]
            }));
          ' "$title" "$body" "$([[ "$BACKEND_RESULT" == "success" && "$FRONTEND_RESULT" == "success" ]] && echo closed || echo open)")"

          if [[ "$BACKEND_RESULT" == "success" && "$FRONTEND_RESULT" == "success" ]]; then
            if [[ -n "$issue_number" ]]; then
              curl --silent --show-error --fail --request PATCH \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" >/dev/null
              echo "Closed the existing production alert after a successful health check."
            else
              echo "Production health checks passed; there is no open alert to resolve."
            fi
          else
            if [[ -n "$issue_number" ]]; then
              curl --silent --show-error --fail --request PATCH \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" >/dev/null
              echo "Updated the existing production alert."
            else
              payload="$(node -e 'process.stdout.write(JSON.stringify({title: process.argv[1], body: process.argv[2]}))' "$title" "$body")"
              curl --silent --show-error --fail --request POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" >/dev/null
              echo "Created a production health alert issue."
            fi
            echo "::error title=Production alert created::One or more production health checks failed. See the single tracked production alert issue."
          fi
