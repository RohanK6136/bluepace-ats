name: Production availability check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-availability.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: production-availability-check
  cancel-in-progress: true

jobs:
  frontend:
    name: Verify Vercel production frontend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production HTML and final-response security headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://bluepace-ats-frontend.vercel.app/"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          if ! status="$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")"; then
            echo "::error title=Frontend request failed::Could not retrieve the Vercel production alias."
            exit 1
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error title=Frontend unavailable::Expected HTTP 200, received $status"
            exit 1
          fi

          python3 - "$headers" "$body" <<'PY'
          import re
          import sys
          from pathlib import Path

          header_path, body_path = map(Path, sys.argv[1:])
          raw_headers = header_path.read_bytes().decode("iso-8859-1")
          blocks = [
              block for block in re.split(r"\r?\n\r?\n", raw_headers)
              if re.search(r"^HTTP/\S+\s+\d{3}", block, re.IGNORECASE | re.MULTILINE)
          ]
          if not blocks:
              raise SystemExit("::error title=Invalid HTTP response::No HTTP response headers were captured.")

          # curl writes one header block per redirect. Validate only the final
          # response so a redirect cannot mask missing headers on the page.
          final_headers = {}
          for line in blocks[-1].splitlines()[1:]:
              if ":" not in line:
                  continue
              name, value = line.split(":", 1)
              final_headers[name.strip().lower()] = value.strip()

          html = body_path.read_text(encoding="utf-8", errors="replace")
          if not re.search(r"<title>\s*BluePace ATS", html, re.IGNORECASE):
              raise SystemExit("::error title=Unexpected frontend content::Expected BluePace ATS page title was not found.")
          if not re.search(r'id=["\']root["\']', html, re.IGNORECASE):
              raise SystemExit("::error title=Unexpected frontend content::React root element was not found.")

          required = {
              "strict-transport-security": r"(?:^|;\s*)max-age=31536000(?:;|$)",
              "x-content-type-options": r"^nosniff$",
              "x-frame-options": r"^DENY$",
              "referrer-policy": r"^strict-origin-when-cross-origin$",
          }
          for name, pattern in required.items():
              value = final_headers.get(name, "")
              if not re.search(pattern, value, re.IGNORECASE):
                  raise SystemExit(f"::error title=Missing security header::{name} missing or invalid on final response.")

          policy = final_headers.get("permissions-policy", "")
          for feature in ("camera", "microphone", "geolocation"):
              if not re.search(rf"(?:^|,)\s*{feature}=\(\)", policy, re.IGNORECASE):
                  raise SystemExit(f"::error title=Invalid permissions policy::{feature} must be disabled.")

          print("Production check passed: HTTP 200, expected page title and React root, and all required security headers on the final response.")
          PY

- name: Check JD & Applicant Match model registry
        shell: bash
        run: |
          set -euo pipefail
          url="https://bluepace-ats-frontend.vercel.app/v1/models"
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --location --max-time 15 "$url" || true)"
            if node -e '
              const fs = require("node:fs");
              let rows;
              try { rows = JSON.parse(fs.readFileSync(0, "utf8")); } catch { process.exit(1); }
              if (!Array.isArray(rows)) process.exit(1);
              const ids = new Set(rows.map((row) => row.id));
              for (const id of ["openrouter", "gemini", "deepseek", "grok", "openai", "github-models"]) {
                if (!ids.has(id)) process.exit(1);
              }
              const retired = rows.find((row) => row.id === "github-models");
              if (retired.enabled !== false || !/retired/i.test(retired.disabled_reason || "")) process.exit(1);
            ' <<< "$response"; then
              echo "JD & Applicant Match model registry is live; provider profiles are being served by Vercel."
              exit 0
            fi
            echo "Model API not ready or returned unexpected output (attempt $attempt/12)."
            sleep 5
          done
          echo "::error title=JD & Applicant Match API missing::The live /v1/models endpoint did not return the expected model registry."
          exit 1

