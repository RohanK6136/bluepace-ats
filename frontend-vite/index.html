<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BluePace Tech AI-powered ATS — extract resumes and match candidates to job descriptions."
    />
    <title>BluePace ATS — Candidate Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const recoveryKey = "bluepace:asset-recovery-at";
        const refreshForFreshAssets = () => {
          try {
            const lastAttempt = Number(sessionStorage.getItem(recoveryKey) || "0");
            // Avoid a reload loop if the requested asset is genuinely unavailable.
            if (Date.now() - lastAttempt < 60000) return;
            sessionStorage.setItem(recoveryKey, String(Date.now()));
          } catch {
            return;
          }
          window.location.reload();
        };

        // Existing tabs can request hashed chunks from the previous deployment.
        // Vite emits this event when a lazy-loaded module cannot be fetched.
        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          refreshForFreshAssets();
        });

        // Also recover if the cached HTML points at an entry bundle removed by
        // a deployment before the application JavaScript has started.
        window.addEventListener("error", (event) => {
          const target = event.target;
          if (
            target instanceof HTMLScriptElement &&
            /\/assets\/.+\.js(?:\?|$)/.test(target.src)
          ) {
            refreshForFreshAssets();
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
